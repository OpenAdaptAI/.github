name: Issue qualification admission v2

on:
  workflow_dispatch:
    inputs:
      candidate_base64:
        description: Canonical qualification admission JSON plus LF, in base64
        required: true
        type: string
      candidate_sha256:
        description: Exact sha256-prefixed candidate digest
        required: true
        type: string
      candidate_size_bytes:
        description: Exact candidate byte length
        required: true
        type: number

permissions: {}

concurrency:
  group: issue-qualification-admission-${{ inputs.candidate_sha256 }}
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Refuse an untrusted dispatcher
        env:
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
          EXPECTED_ACTOR_ID: ${{ vars.OPENADAPT_LIFECYCLE_ACTOR_ID }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$REPOSITORY" = 'OpenAdaptAI/.github'
          test "$REPOSITORY_ID" = '858454062'
          test "$REPOSITORY_OWNER_ID" = '132681217'
          test "$REF" = 'refs/heads/main'
          test "$EVENT_NAME" = 'workflow_dispatch'
          test "$ACTOR" = 'openadapt-lifecycle[bot]'
          test "$TRIGGERING_ACTOR" = 'openadapt-lifecycle[bot]'
          test -n "$EXPECTED_ACTOR_ID"
          test "$ACTOR_ID" = "$EXPECTED_ACTOR_ID"
          test "$WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$WORKFLOW_REF" = \
            'OpenAdaptAI/.github/.github/workflows/issue-qualification-admission.yml@refs/heads/main'

  issue:
    name: Stage one qualification admission for review
    needs: authorize
    if: >-
      github.repository == 'OpenAdaptAI/.github' &&
      github.repository_id == '858454062' &&
      github.repository_owner_id == '132681217' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.actor == 'openadapt-lifecycle[bot]' &&
      github.triggering_actor == 'openadapt-lifecycle[bot]' &&
      github.actor_id == vars.OPENADAPT_LIFECYCLE_ACTOR_ID
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: qualification-admission
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out the exact issuer commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Install the pinned GitHub attestation verifier
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gh_2.98.0_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            https://github.com/cli/cli/releases/download/v2.98.0/gh_2.98.0_linux_amd64.tar.gz
          echo "3b8ac6b30336802fc1a858d7c084e11cdf24ac1a761ca90b68022d7d729208de  $archive" \
            | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gh_2.98.0_linux_amd64/bin" >> "$GITHUB_PATH"

      - name: Install the pinned legacy message-signature verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.0
        with:
          cosign-release: v3.1.3

      - name: Bind the legacy verifier and trust material
        run: |
          set -euo pipefail
          cosign_path=$(command -v cosign)
          test "$(wc -c < "$cosign_path" | tr -d ' ')" = '141178250'
          echo "4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71  $cosign_path" \
            | sha256sum --check --strict
          trusted_root="$RUNNER_TEMP/sigstore-trusted-root.json"
          curl --fail --location --silent --show-error \
            --output "$trusted_root" \
            https://raw.githubusercontent.com/sigstore/root-signing/c6f23ff62645fb0c46ebc7945675835b52f91aa8/targets/trusted_root.json
          test "$(wc -c < "$trusted_root" | tr -d ' ')" = '6787'
          echo "6494e21ea73fa7ee769f85f57d5a3e6a08725eae1e38c755fc3517c9e6bc0b66  $trusted_root" \
            | sha256sum --check --strict
          echo "OPENADAPT_SIGSTORE_TRUSTED_ROOT=$trusted_root" >> "$GITHUB_ENV"

      - name: Assume the central signing role after environment approval
        id: aws
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::992382684924:role/openadapt-production-trust-signer
          aws-region: us-east-1
          role-session-name: oa-trust-${{ github.run_id }}
          role-duration-seconds: 900
          allowed-account-ids: "992382684924"
          unset-current-credentials: true
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["kms:GetPublicKey","kms:Sign"],"Resource":"arn:aws:kms:us-east-1:992382684924:key/*","Condition":{"ForAnyValue:StringEquals":{"kms:ResourceAliases":"alias/openadapt-production-trust-v1"}}}]}

      - name: Validate and sign the exact canonical candidate
        id: candidate
        env:
          AWS_ACCOUNT_OUTPUT: ${{ steps.aws.outputs.aws-account-id }}
          CANDIDATE_BASE64: ${{ inputs.candidate_base64 }}
          EXPECTED_SHA256: ${{ inputs.candidate_sha256 }}
          EXPECTED_SIZE_BYTES: ${{ inputs.candidate_size_bytes }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          current_main=$(git ls-remote --exit-code --heads origin refs/heads/main | cut -f1)
          test "$current_main" = "$GITHUB_SHA"
          test "$AWS_ACCOUNT_OUTPUT" = '992382684924'
          python3 scripts/issue_production_trust_object.py issue-candidate \
            --kind qualification-admission \
            --candidate-base64-env CANDIDATE_BASE64 \
            --expected-sha256 "$EXPECTED_SHA256" \
            --expected-size-bytes "$EXPECTED_SIZE_BYTES" \
            --source-commit "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/qualification-admission.json" \
            --bundle-output "$RUNNER_TEMP/qualification-admission.sigstore.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Remove the temporary KMS role credentials
        run: |
          set -euo pipefail
          {
            echo 'AWS_ACCESS_KEY_ID='
            echo 'AWS_SECRET_ACCESS_KEY='
            echo 'AWS_SESSION_TOKEN='
          } >> "$GITHUB_ENV"

      - name: Append the object pair to the registry candidate
        run: |
          set -euo pipefail
          cp evidence-registry.json "$RUNNER_TEMP/previous-evidence-registry.json"
          python3 scripts/stage_production_evidence.py \
            --kind qualification-admission \
            --object "$RUNNER_TEMP/qualification-admission.json" \
            --bundle "$RUNNER_TEMP/qualification-admission.sigstore.json"
          python3 scripts/validate_evidence_registry.py \
            --previous-registry "$RUNNER_TEMP/previous-evidence-registry.json"

      - name: Push one deterministic review branch
        env:
          REVIEW_BRANCH: ${{ steps.candidate.outputs.review_branch }}
        run: |
          set -euo pipefail
          git switch -c "$REVIEW_BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add evidence-registry.json production-evidence/objects
          git commit -m 'chore: propose qualification admission'
          existing=$(git ls-remote --heads origin "refs/heads/$REVIEW_BRANCH" | cut -f1)
          if [ -n "$existing" ]; then
            git fetch --no-tags origin "refs/heads/$REVIEW_BRANCH"
            test "$(git rev-parse 'FETCH_HEAD^{tree}')" = "$(git rev-parse 'HEAD^{tree}')"
          else
            git push origin "HEAD:refs/heads/$REVIEW_BRANCH"
          fi

      - name: Create the lifecycle App pull-request token
        id: lifecycle-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.OPENADAPT_LIFECYCLE_APP_ID }}
          private-key: ${{ secrets.OPENADAPT_LIFECYCLE_APP_PRIVATE_KEY }}
          owner: OpenAdaptAI
          repositories: .github
          permission-pull-requests: write

      - name: Open a draft review pull request without merging it
        env:
          GH_TOKEN: ${{ steps.lifecycle-app.outputs.token }}
          LIFECYCLE_APP_SLUG: ${{ steps.lifecycle-app.outputs.app-slug }}
          REVIEW_BRANCH: ${{ steps.candidate.outputs.review_branch }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$LIFECYCLE_APP_SLUG" = 'openadapt-lifecycle'
          existing=$(gh pr list --base main --head "$REVIEW_BRANCH" --state open \
            --json url --jq '.[0].url // empty')
          if [ -n "$existing" ]; then
            echo "The draft review already exists: $existing"
            exit 0
          fi
          body="OpenAdapt's protected qualification-admission environment issued one canonical qualification admission from OpenAdaptAI/.github@${SOURCE_COMMIT}. This draft adds the object, its AWS KMS DSSE bundle, and the append-only registry entry for review. It doesn't merge or activate the admission."
          gh pr create --draft --base main --head "$REVIEW_BRANCH" \
            --title 'chore: review qualification admission' --body "$body"

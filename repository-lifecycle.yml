schema_version: 2
reviewed_on: 2026-08-26
canonical_product:
  launcher: OpenAdapt
  engine: openadapt-flow
public_metadata:
  organization_description: >-
    Governed automation across browser, desktop, RDP, and Citrix: compile a
    demonstration, verify the result, and halt on uncertainty.
  pinned_repositories:
    - OpenAdapt
    - openadapt-flow
    - openadapt-desktop
    - openadapt-capture
    - openadapt-agent
    - openadapt-evals
  repository_descriptions:
    .github: >-
      Organization profile and shared community files for OpenAdapt.
    OpenAdapt: >-
      Installer and unified CLI for OpenAdapt. The compiler and governed
      runtime live in openadapt-flow.
    openadapt-flow: >-
      Compiler and governed runtime for demonstrated GUI workflows, with
      explicit identity, policy, and result checks.
    openadapt-web: >-
      Source for openadapt.ai, including product pages, evidence, pricing, and
      workflow qualification.
    openadapt-ops: >-
      Source for docs.openadapt.ai, with checks and runbooks that keep the
      documentation current.
    openadapt-cloud: >-
      Proprietary hosted control plane for workflow qualification, deployment,
      attended operation, and governed repair.
    openadapt-desktop: >-
      Desktop application for local workflow authoring, operation, evidence
      review, and governed repair.
    openadapt-capture: >-
      Native desktop recorder that keeps screen, input, timing, and
      window-scoped evidence synchronized.
    openadapt-agent: >-
      Local bridge that exposes governed OpenAdapt workflows to MCP clients and
      Agent Skills.
lifecycle:
  production: []
  support:
    - .github
    - openadapt-web
    - openadapt-ops
    - openadapt-wright
    - openadapt-herald
    - openadapt-crier
    - openadapt-consilium
    - openadapt-telemetry
    - openadapt-viewer
    - openadapt-blog
  beta: []
  experimental:
    - openadapt-privacy
    - openadapt-types
    - openadapt-console
    - openadapt-tray
  research:
    - openadapt-ml
    - openadapt-evals
    - openadapt-retrieval
    - openadapt-grounding
    - openadapt-verifier
  internal:
    - openadapt-bootstrap
    - openadapt-internal
    - openadapt-yc
    - openadapt-presenter
  labs:
    - OmniMCP
    - SoM
    - PydanticPrompt
  historical: []
  superseded:
    - OpenSanitizer
  deprecated: []
  archived:
    - openadapt-new
    - openadapt-gitbook
    - OpenReflector
    - OpenAdapter
public_surfaces:
  production: []
  beta: []

schema_version: 1
reviewed_on: 2026-07-15
canonical_product:
  launcher: OpenAdapt
  engine: openadapt-flow
lifecycle:
  beta:
    - OpenAdapt
    - openadapt-flow
    - openadapt-cloud
  experimental:
    - openadapt-desktop
    - openadapt-capture
    - openadapt-privacy
    - openadapt-types
    - openadapt-console
    - openadapt-tray
  research:
    - openadapt-ml
    - openadapt-evals

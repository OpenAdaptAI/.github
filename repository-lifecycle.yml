  labs:
    - OmniMCP
    - SoM
    - PydanticPrompt
  historical:
    - OpenReflector
    - OpenAdapter
  superseded:
    - OpenSanitizer
  deprecated:
    - openadapt-agent
  archived:
    - openadapt-new
    - openadapt-gitbook
local_relocation:
  workspace_assumption:
    user_supplied: ~/os/src
    resolved_current_workspace: /Users/abrichr/oa/src
    requires_reconfirmation: true
  destination: /Users/abrichr/oa/src/_deprecated
  ready_now:
    - checkout: openadapt-gitbook
      reason: obsolete_docs_clean_remote_aligned
  retirement_decision_required:
    - checkout: OpenSanitizer
      reason: superseded_by_openadapt_privacy_clean
      required_status_before_move: archived
      proposed_destination: /Users/abrichr/oa/src/_deprecated/OpenSanitizer
    - checkout: OpenReflector
      reason: historical_direction_clean_remote_aligned
      decision: archive_or_labs
      proposed_destination_if_archived: /Users/abrichr/oa/src/_deprecated/OpenReflector
    - checkout: OpenAdapter
      reason: historical_model_deployment_direction_clean
      decision: archive_or_labs
      proposed_destination_if_archived: /Users/abrichr/oa/src/_deprecated/OpenAdapter
  duplicate_checkout_cleanup:
    - checkout: openadapt-hosted
      reason: duplicate_checkout_ancestor_of_openadapt_cloud
      repository_lifecycle_change: false
      optional_parking_destination: /Users/abrichr/oa/src/_deprecated/_duplicate-checkouts/openadapt-hosted
  preflight:
    executes_move: false
    checkout: openadapt-gitbook
    requires: [clean_worktree, upstream_head_match, destination_absent, explicit_move_approval]
  blocked:
    - checkout: openadapt-agent
      blockers: [dirty_worktree]
    - checkout: openadapt-new
      blockers: [dirty_worktree]
    - checkout: openadapt-bootstrap
      blockers: [untracked_design_work, active_discovery_references, lifecycle_decision]
    - checkout: openadapt-maintenance
      blockers: [active_pushed_branch, duplicate_checkout_not_deprecated]
    - checkout: PydanticPrompt
      blockers: [dirty_worktree, labs_destination_preferred]
    - checkout: OmniMCP
      local_checkout: omnimcp
      blockers: [dirty_worktree, compatibility_test_reference, labs_destination_preferred]
    - checkout: SoM
      blockers: [dirty_worktree, possible_credentials_require_rotation, labs_destination_preferred]
  do_not_move:
    - pattern: openadapt-flow-*
      reason: registered_git_worktrees
    - pattern: openadapt-web-wt-*
      reason: registered_git_worktrees

schema_version: 2
reviewed_on: 2026-08-26
canonical_product:
  launcher: OpenAdapt
  engine: openadapt-flow
public_metadata:
  organization_description: >-
    Governed automation across browser, desktop, RDP, and Citrix: compile a
    demonstration, verify the result, and halt on uncertainty.
  pinned_repositories:
    - OpenAdapt
    - openadapt-flow
    - openadapt-desktop
    - openadapt-capture
    - openadapt-agent
    - openadapt-evals
  repository_descriptions:
    openadapt-desktop: >-
      Desktop cockpit for recording, qualification, local execution, evidence,
      and governed repair across OpenAdapt workflows.
    openadapt-capture: >-
      Native screen, input, timing, and window-scoped recording for OpenAdapt
      Desktop and Flow.
    openadapt-agent: >-
      Local bridge exposing governed OpenAdapt workflows as MCP tools and Agent
      Skills; halts remain halts.
